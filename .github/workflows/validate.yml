name: Validate companion resources
on:
  push:
    branches: [main, paper-companion-restructure]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m analysis.insight rebuild --output-dir outputs/ci-rebuild
